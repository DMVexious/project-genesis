<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Genesis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="stage">
      <div id="game"></div>
      <div id="overlay" aria-hidden="true"></div>
      <div id="banner" hidden></div>
      <div id="timeline" title="Replay: the page records recent ticks. The live world keeps running while you watch.">
        <span id="tl-badge">⏪ REPLAY</span>
        <button id="tl-rev" title="Play backwards (shift+,)">◀◀</button>
        <button id="tl-back" title="Step back one tick (,)">⏴</button>
        <button id="tl-play" title="Play / pause the replay (enter)">▶</button>
        <button id="tl-fwd" title="Step forward one tick (.)">⏵</button>
        <select id="tl-speed" title="Replay speed">
          <option value="0.5">½×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
        </select>
        <input id="tl-scrub" type="range" min="0" max="0" value="0" aria-label="Timeline">
        <span id="tl-tick"></span>
        <button id="tl-live" title="Back to the live world (esc)">● LIVE</button>
      </div>
    </section>

    <aside id="panel">
      <header>
        <h1>Project Genesis</h1>
        <div id="conn" class="pill">connecting…</div>
      </header>

      <div id="stats" class="stats"></div>

      <div class="controls">
        <button id="btn-pause" title="Pause / resume (space)">⏸</button>
        <button id="btn-step" title="Advance one tick">⏭</button>
        <label>Speed <input id="speed" type="range" min="50" max="1000" step="25"></label>
        <span id="speed-val"></span>
      </div>
      <div class="controls">
        <label>Seed <input id="seed" type="number" min="0"></label>
        <button id="btn-reset">New world</button>
      </div>

      <div class="hint">Drag to pan · scroll to zoom · WASD / arrows · click an NPC to follow it</div>
      <div class="hint">🏠 hut (home) · 🌾 farm · 🔥 campfire · 🪦 grave · ring colour under feet = temperament</div>

      <h2 class="row">Conversations
        <label class="toggle" title="Hide pre-written lines; show only what the LLM wrote"><input type="checkbox" id="llm-only"> 🧠 LLM only</label></h2>
      <ol id="talks"><li class="hint">Nobody has spoken yet. NPCs talk when they meet.</li></ol>

      <h2>Population</h2>
      <ul id="npc-list"></ul>

      <div id="detail" hidden></div>

      <h2>Chronicle</h2>
      <ol id="log"></ol>
    </aside>
  </main>

  <script src="vendor/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
